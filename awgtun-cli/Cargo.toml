[package]
authors = ["Noah Kennedy <nkennedy@cloudflare.com>", "Andy Grover <agrover@cloudflare.com>", "Jeff Hiner <jhiner@cloudflare.com>"]
description = "A userspace AmneziaWG and WireGuard tunnel for Linux and macOS"
documentation = "https://docs.rs/awgtun"
keywords = ["wireguard", "amneziawg", "vpn", "obfuscation", "dpi"]
categories = ["network-programming", "command-line-utilities"]
edition = "2021"
# Higher than the library's: clap and the `time` crate beneath it require it.
rust-version = "1.88"
license = "BSD-3-Clause"
name = "awgtun-cli"
readme = "../README.md"
repository = "https://github.com/AYastrebov/awgtun"
version = "0.9.0"

[dependencies]
clap = {version = "4.6.0", features = ["env"]}
daemonize = "0.5"
tracing = "0.1.40"
tracing-appender = "0.2.1"
tracing-subscriber = "0.3.19"

[dependencies.awgtun]
features = ["device"]
path = "../awgtun"
version = "0.9.0"
