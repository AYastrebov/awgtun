[package]
name = "awgtun"
description = "AmneziaWG 2.0/3.0/3.1 and WireGuard in Rust, without a network or tunnel stack"
version = "0.11.0"
authors = [
    "Noah Kennedy <nkennedy@cloudflare.com>",
    "Andy Grover <agrover@cloudflare.com>",
    "Jeff Hiner <jhiner@cloudflare.com>",
]
license = "BSD-3-Clause"
readme = "../README.md"
repository = "https://github.com/AYastrebov/awgtun"
documentation = "https://docs.rs/awgtun"
keywords = ["wireguard", "amneziawg", "vpn", "obfuscation", "dpi"]
categories = ["network-programming", "cryptography"]
edition = "2018"
# Chosen, not discovered. 1.85 was the floor of the RustCrypto, `x25519-dalek`
# 3.0 and `jni` 0.22 generations; 1.97 is what lets `parking_lot` 0.13 (1.95)
# in, and puts the library, the FFI crate and the CLI on one number instead of
# the CLI quietly needing more than the library advertised. CI pins a job here
# so it stays true.
rust-version = "1.97"

[features]
default = []
device = ["socket2", "thiserror"]
# mocks std::time::Instant with mock_instant
mock-instant = ["mock_instant"]

[dependencies]
base64 = "0.22"
hex = "0.4"
untrusted = "0.9.0"
libc = "0.2"
parking_lot = "0.12"
portable-atomic = { version = "1.13.1", features = ["fallback"] }
tracing = "0.1.40"
ip_network = "0.4.1"
ip_network_table = "0.2.0"
ring = "0.17"
subtle = "2.6"
x25519-dalek = { version = "3.0", features = [
    "getrandom",
    "reusable_secrets",
    "static_secrets",
] }
# The OS RNG. rand_core 0.10 dropped `OsRng`; x25519-dalek's `getrandom`
# feature draws keys from this same crate.
getrandom = "0.4"
chacha20 = "0.10"
# Stable requirements, not the `0.10.0-pre.1`/`0.5.0-pre.2` these used to name.
# A pre-release in a requirement opts that dependency into pre-release
# resolution, so `cargo update` was free to pull an unreleased AEAD into the
# packet path. Both already resolved to stable; this stops them drifting back.
chacha20poly1305 = "0.11"
aead = "0.6"
# Move as a group: `hmac::SimpleHmac<Blake2s256>` computes the WireGuard KDF,
# so `hmac` and `blake2` must agree on the `digest` major version (0.11).
blake2 = "0.11"
hmac = "0.13"
mock_instant = { version = "0.3", optional = true }
socket2 = { version = "0.4.7", features = ["all"], optional = true }
thiserror = { version = "2", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = [
    "time",
    "user",
] }

[dev-dependencies]
etherparse = "0.13"
tracing-subscriber = "0.3"
criterion = { version = "0.8.2", features = ["html_reports"] }

[lib]
# A plain rlib. The C and JNI artefacts live in the `awgtun-ffi` crate: Cargo
# cannot feature-gate `crate-type`, so keeping them here made every Rust
# consumer build and link a staticlib and a cdylib it never used, and made
# cargo-ndk copy an unloadable cdylib into downstream Android AARs.
crate-type = ["rlib"]

[[bench]]
name = "crypto_benches"
harness = false
