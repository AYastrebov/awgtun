[package]
name = "boringtun"
description = "an implementation of the WireGuard® protocol designed for portability and speed"
version = "0.7.1"
authors = [
    "Noah Kennedy <nkennedy@cloudflare.com>",
    "Andy Grover <agrover@cloudflare.com>",
    "Jeff Hiner <jhiner@cloudflare.com>",
]
license = "BSD-3-Clause"
readme = "../README.md"
repository = "https://github.com/cloudflare/boringtun"
documentation = "https://docs.rs/boringtun/0.7.1/boringtun/"
edition = "2018"
# Chosen, not discovered. This used to read 1.78 — the floor that fell out of
# Cargo.lock being format v4 — but that was never a compatibility promise, and
# holding it meant pinning transitive crates that had moved on (`zeroize` 1.9
# raised its own floor from 1.60 to 1.85). 1.85 is the lowest version the
# current dependency graph builds on, it is what the RustCrypto, `x25519-dalek`
# 3.0 and `jni` 0.22 generations require, and `boringtun-cli` already demands
# 1.88 — so no one building this repo end to end was served by the lower claim.
# CI pins a job here so it stays true.
rust-version = "1.85"

[features]
default = []
device = ["socket2", "thiserror"]
# Sans-io (runtime-agnostic, synchronous) multi-peer AmneziaWG/WireGuard server
# core. No new dependencies: uses only always-on deps plus the crate's own
# `noise`/`amnezia`.
server = []
jni-bindings = ["ffi-bindings", "jni"]
ffi-bindings = ["tracing-subscriber"]
# mocks std::time::Instant with mock_instant
mock-instant = ["mock_instant"]

[dependencies]
base64 = "0.22"
hex = "0.4"
untrusted = "0.9.0"
libc = "0.2"
parking_lot = "0.12"
portable-atomic = { version = "1.13.1", features = ["fallback"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["fmt"], optional = true }
ip_network = "0.4.1"
ip_network_table = "0.2.0"
ring = "0.17"
subtle = "2.6"
x25519-dalek = { version = "2.0.1", features = [
    "reusable_secrets",
    "static_secrets",
] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
chacha20 = "0.9"
# Stable requirements, not the `0.10.0-pre.1`/`0.5.0-pre.2` these used to name.
# A pre-release in a requirement opts that dependency into pre-release
# resolution, so `cargo update` was free to pull an unreleased AEAD into the
# packet path. Both already resolved to stable; this stops them drifting back.
chacha20poly1305 = "0.10"
aead = "0.5"
# Pinned as a group: `hmac::SimpleHmac<Blake2s256>` computes the WireGuard KDF,
# so `hmac` and `blake2` must agree on the `digest` major version. `hmac` 0.13
# is on `digest` 0.11 and `blake2` has no stable 0.11 yet (0.11.0-rc.6 at the
# time of writing), which holds this pair — and with it `aead` 0.6,
# `chacha20poly1305` 0.11 and the rest of the RustCrypto wave that drops
# `generic-array` for `hybrid-array` — at the `digest` 0.10 generation.
blake2 = "0.10"
hmac = "0.12"
jni = { version = "0.19.0", optional = true }
mock_instant = { version = "0.3", optional = true }
socket2 = { version = "0.4.7", features = ["all"], optional = true }
thiserror = { version = "2", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = [
    "time",
    "user",
] }

[dev-dependencies]
etherparse = "0.13"
tracing-subscriber = "0.3"
criterion = { version = "0.8.2", features = ["html_reports"] }

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bench]]
name = "crypto_benches"
harness = false
