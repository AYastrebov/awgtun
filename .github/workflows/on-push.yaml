name: PR Status Checks

# `master` is the only long-lived branch; the AmneziaWG work was merged into it
# and `amnezia` deleted. Feature branches are covered by the pull_request
# trigger, which fires regardless of the source branch's name.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Lets a run be started from the Actions tab without an empty commit, which
  # is what you want when a job failed for an environmental reason rather than
  # a code one.
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # Fail on any warning rather than letting them accumulate until nobody reads
  # the log.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Depends on all actions that are required for a "successful" CI run.
  # Based on the ci here: https://github.com/tokio-rs/tokio/blob/master/.github/workflows/ci.yml
  all-systems-go:
    runs-on: ubuntu-latest
    needs:
      - check_features
      - clippy
      - rustfmt
      - docs
      - benches
      - msrv
      - deny
      - tests
      - integration-tests
      - test-windows
    steps:
      - run: exit 0

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check Windows
        run: cargo check --locked -p awgtun

      - name: Test Windows
        run: cargo test --locked -p awgtun

  check_features:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --locked --each-feature

  clippy:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      # A powerset rather than each-feature: `device` and `mock-instant`
      # interact (the latter freezes the clock the former's timers depend on),
      # and combinations like that are exactly what testing features one at a
      # time cannot see. Depth 2 keeps the matrix bounded.
      - run: cargo hack clippy --locked --feature-powerset --depth 2 --all-targets

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # RUSTDOCFLAGS above turns broken intra-doc links into errors. The docs
      # here lean on `[`Type`]` links heavily, and a rename silently breaks them
      # otherwise.
      - run: cargo doc --locked --no-deps -p awgtun --features device

  benches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo test` does not build bench targets, so without this the criterion
      # benchmarks can stop compiling and nothing notices. Compile only — timing
      # numbers from a shared runner are noise.
      - run: cargo bench --locked --no-run

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned to `rust-version` in awgtun/Cargo.toml. The library is what
      # FFI, JNI and Rust consumers depend on, so it carries the MSRV; the CLI
      # follows whatever clap and its dependencies require, which is newer.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      # `check`, not `test`: the dev-dependencies (criterion, and `time` beneath
      # it) require much newer toolchains, and an MSRV claim is about building
      # the library, not running its test suite.
      #
      # If this job starts failing after a `cargo update`, a transitive
      # dependency raised its own `rust-version` past ours. Either pin that
      # crate with `cargo update -p <crate> --precise <last good version>` or
      # raise `rust-version` to match; prefer raising it unless a consumer
      # actually needs the older toolchain, since pinning holds the whole graph
      # back to keep a number that nothing depends on.
      - run: cargo check --locked -p awgtun --lib
      - run: cargo check --locked -p awgtun --lib --features device

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  tests:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        toolchain: [ stable, beta ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack test --locked --each-feature

  integration-tests:
    # Linux only: the integration_tests module is cfg'd off on macOS, so the
    # job was a no-op there. These need root and a TUN device, and some spin up
    # Docker containers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Deliberately not --all-features: that enables `mock-instant`, which
      # freezes the clock so no timer fires, nothing is sent, and every device
      # test fails looking exactly like a protocol bug. `device` arrives here
      # through awgtun-cli's dependency.
      - run: cargo test --locked -- --ignored
