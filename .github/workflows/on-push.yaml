name: PR Status Checks

# `master` is the only long-lived branch; the AmneziaWG work was merged into it
# and `amnezia` deleted. Feature branches are covered by the pull_request
# trigger, which fires regardless of the source branch's name.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Lets a run be started from the Actions tab without an empty commit, which
  # is what you want when a job failed for an environmental reason rather than
  # a code one.
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # Fail on any warning rather than letting them accumulate until nobody reads
  # the log.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Depends on all actions that are required for a "successful" CI run.
  # Based on the ci here: https://github.com/tokio-rs/tokio/blob/master/.github/workflows/ci.yml
  all-systems-go:
    runs-on: ubuntu-latest
    needs:
      - check_features
      - clippy
      - rustfmt
      - docs
      - benches
      - msrv
      - deny
      - tests
      - integration-tests
      - cross-build
      - android-build
      - test-windows
    steps:
      - run: exit 0

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check Windows
        run: cargo check --locked -p awgtun

      - name: Test Windows
        run: cargo test --locked -p awgtun

  check_features:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --locked --each-feature

  clippy:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      # A powerset rather than each-feature: `device` and `mock-instant`
      # interact (the latter freezes the clock the former's timers depend on),
      # and combinations like that are exactly what testing features one at a
      # time cannot see. Depth 2 keeps the matrix bounded.
      - run: cargo hack clippy --locked --feature-powerset --depth 2 --all-targets

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # RUSTDOCFLAGS above turns broken intra-doc links into errors. The docs
      # here lean on `[`Type`]` links heavily, and a rename silently breaks them
      # otherwise.
      - run: cargo doc --locked --no-deps -p awgtun --features device

  benches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo test` does not build bench targets, so without this the criterion
      # benchmarks can stop compiling and nothing notices. Compile only — timing
      # numbers from a shared runner are noise.
      - run: cargo bench --locked --no-run

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned to `rust-version` in awgtun/Cargo.toml. The library is what
      # FFI, JNI and Rust consumers depend on, so it carries the MSRV; the CLI
      # follows whatever clap and its dependencies require, which is newer.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      # `check`, not `test`: the dev-dependencies (criterion, and `time` beneath
      # it) require much newer toolchains, and an MSRV claim is about building
      # the library, not running its test suite.
      #
      # If this job starts failing after a `cargo update`, a transitive
      # dependency raised its own `rust-version` past ours. Either pin that
      # crate with `cargo update -p <crate> --precise <last good version>` or
      # raise `rust-version` to match; prefer raising it unless a consumer
      # actually needs the older toolchain, since pinning holds the whole graph
      # back to keep a number that nothing depends on.
      - run: cargo check --locked -p awgtun --lib
      - run: cargo check --locked -p awgtun --lib --features device

  # Every target the README advertises and the release workflow ships. Without
  # this, a cross-compilation break is only discovered at release time, when the
  # tag is already pushed and the fix means a new one.
  cross-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native ARM64 runner rather than `cross`, so this target gets its
          # tests run and not merely compiled. Emulated or cross-compiled ARM
          # would only tell us it builds.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            cross: false
            test: true
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            cross: false
            armv7: true
          # macos-latest is Apple Silicon, so this is a native build too.
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            test: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
        if: matrix.cross
      # `cross` cannot build this target: ring's build script passes
      # -mno-omit-leaf-frame-pointer, which is an x86 GCC option that no ARM
      # gcc accepts. clang takes it on every architecture, so it compiles the C
      # and the GNU toolchain only links.
      - name: ARM cross toolchain
        if: matrix.armv7
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      # The library is the part that has to build everywhere. The CLI needs a
      # TUN stack and is only shipped for the platforms that have one.
      # Building the FFI crate pulls the library in as a dependency, so this
      # covers both.
      - name: Build library and C bindings
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: clang
          CFLAGS_armv7_unknown_linux_gnueabihf: --target=arm-linux-gnueabihf --sysroot=/usr/arm-linux-gnueabihf
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --locked -p awgtun-ffi --target ${{ matrix.target }}
      - name: Build CLI
        if: "!contains(matrix.target, 'android')"
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: clang
          CFLAGS_armv7_unknown_linux_gnueabihf: --target=arm-linux-gnueabihf --sysroot=/usr/arm-linux-gnueabihf
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --locked -p awgtun-cli --target ${{ matrix.target }}
      # Only where the runner is the target architecture. A cross-compiled
      # binary cannot be executed here, and "it compiled" is a much weaker
      # claim than "its tests pass".
      - name: Test
        if: matrix.test
        run: cargo test --locked -p awgtun --target ${{ matrix.target }} --features device

  # cargo-ndk with a real NDK, the same way the release workflow builds these.
  # `cross` cannot: its Android images fail to link against libunwind.
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - run: cargo install cargo-ndk --locked
      - name: Build every ABI
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 build --locked -p awgtun-ffi --features jni-bindings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  tests:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        toolchain: [ stable, beta ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack test --locked --each-feature

  integration-tests:
    # Linux only: the integration_tests module is cfg'd off on macOS, so the
    # job was a no-op there. These need root and a TUN device, and some spin up
    # Docker containers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Deliberately not --all-features: that enables `mock-instant`, which
      # freezes the clock so no timer fires, nothing is sent, and every device
      # test fails looking exactly like a protocol bug. `device` arrives here
      # through awgtun-cli's dependency.
      - run: cargo test --locked -- --ignored
